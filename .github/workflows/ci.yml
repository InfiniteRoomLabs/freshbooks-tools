name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lib:
    name: lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          cache: true
      - run: mise run check -- freshbooks

  mcp:
    name: mcp
    runs-on: ubuntu-latest
    needs: lib
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          cache: true
      - run: mise run check -- mcp

  cli:
    name: cli
    runs-on: ubuntu-latest
    needs: lib
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          cache: true
      - run: mise run check -- cli
