name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  lib:
    name: lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: mise run check -- freshbooks

  mcp:
    name: mcp
    runs-on: ubuntu-latest
    needs: lib
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: mise run check -- mcp

  cli:
    name: cli
    runs-on: ubuntu-latest
    needs: lib
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: mise run check -- cli
