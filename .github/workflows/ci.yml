name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lib:
    name: lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - run: mise run check -- freshbooks

  mcp:
    name: mcp
    runs-on: ubuntu-latest
    needs: lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - run: mise run check -- mcp

  cli:
    name: cli
    runs-on: ubuntu-latest
    needs: lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - run: mise run check -- cli

  # The module-independent gate steps (actionlint, shellcheck, the redaction
  # and release selftests, readme-drift-check, site-build).
  # `mise run check -- <module>` skips them, so the three module jobs no
  # longer pay for the same work three times; this job pays for it once.
  # fetch-depth: 0 because readme-drift-check reads the release tags;
  # site-build is why this job needs node/pnpm and the pnpm store cache.
  repo-wide:
    name: repo-wide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      # mise-action's cache covers mise's own tool installs, not the pnpm
      # content-addressed store, so without this the site build re-downloads
      # every tarball in site/pnpm-lock.yaml on each run.
      - id: pnpm-store
        run: echo "path=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ hashFiles('site/pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: mise run repo-wide
