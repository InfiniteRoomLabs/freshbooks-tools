name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lib:
    name: lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - run: mise run check -- freshbooks

  mcp:
    name: mcp
    runs-on: ubuntu-latest
    needs: lib
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - run: mise run check -- mcp

  cli:
    name: cli
    runs-on: ubuntu-latest
    needs: lib
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - run: mise run check -- cli
