name: Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - README.md
      - site/**
      - scripts/site-sync.sh
      - scripts/site-build.sh
      - scripts/check.sh
      - mise.toml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# Pages allows one active deployment at a time, so overlapping runs make the
# loser fail. Queue instead of cancelling: cancel-in-progress would kill a
# publish mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      # mise-action's cache covers mise's own tool installs, not the pnpm
      # content-addressed store, so without this the site build re-downloads
      # every tarball in site/pnpm-lock.yaml on each run.
      - id: pnpm-store
        run: echo "path=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ hashFiles('site/pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: mise run site-build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/build

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
