name: Release

on:
  push:
    tags:
      - "freshbooks/v*"
      - "mcp/v*"
      - "cli/v*"

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      module: ${{ steps.parse.outputs.module }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse module and version from the tag
        id: parse
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          module="${TAG_NAME%%/*}"
          version="${TAG_NAME#*/v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "guard: '$version' is not strict semver (X.Y.Z)" >&2
            exit 1
          fi
          case "$module" in
            freshbooks|mcp|cli) ;;
            *)
              echo "guard: unknown module '$module' in tag '$TAG_NAME'" >&2
              exit 1
              ;;
          esac
          echo "module=$module" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Confirm the tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          cache: true

      - name: Extract the module's changelog section
        run: |
          scripts/changelog-section.sh "${{ steps.parse.outputs.module }}" "${{ steps.parse.outputs.version }}" > /tmp/release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: /tmp/release-notes.md

  ci:
    name: ci
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: release
    runs-on: ubuntu-latest
    needs: [guard, ci]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: /tmp

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          cache: true

      - name: Run goreleaser
        if: needs.guard.outputs.module == 'mcp' || needs.guard.outputs.module == 'cli'
        uses: goreleaser/goreleaser-action@v6
        with:
          workdir: ${{ needs.guard.outputs.module }}
          args: release --clean --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # goreleaser OSS has no monorepo tag-prefix support (Pro-only);
          # this strips the "<module>/" prefix so {{.Version}} and archive
          # names come out as plain semver. See the NOTE in
          # <module>/.goreleaser.yaml -- Phase 5 verifies this end to end.
          GORELEASER_CURRENT_TAG: v${{ needs.guard.outputs.version }}

      - name: Create the lib release
        if: needs.guard.outputs.module == 'freshbooks'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" --notes-file /tmp/release-notes.md
