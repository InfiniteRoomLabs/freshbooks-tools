name: Release

on:
  push:
    tags:
      - "freshbooks/v*"
      - "mcp/v*"
      - "cli/v*"

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      module: ${{ steps.parse.outputs.module }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Parse module and version from the tag
        id: parse
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          module="${TAG_NAME%%/*}"
          version="${TAG_NAME#*/v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "guard: '$version' is not strict semver (X.Y.Z)" >&2
            exit 1
          fi
          case "$module" in
            freshbooks|mcp|cli) ;;
            *)
              echo "guard: unknown module '$module' in tag '$TAG_NAME'" >&2
              exit 1
              ;;
          esac
          echo "module=$module" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Confirm the tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Extract the module's changelog section (fail fast; the release job re-extracts it)
        run: |
          scripts/changelog-section.sh "${{ steps.parse.outputs.module }}" "${{ steps.parse.outputs.version }}" > /dev/null

  ci:
    name: ci
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: release
    runs-on: ubuntu-latest
    needs: [guard, ci]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Extract the module's changelog section
        run: |
          scripts/changelog-section.sh "${{ needs.guard.outputs.module }}" "${{ needs.guard.outputs.version }}" > /tmp/release-notes.md

      # goreleaser OSS cannot release a prefixed tag ("mcp/vX.Y.Z", "cli/vX.Y.Z"):
      # `--skip=validate` skips its `git describe --exact-match` check (which
      # would fail against a prefixed tag) and its dirty-tree check (moot --
      # this checkout is pristine and `guard` already enforced semver + on-main);
      # `--skip=publish` stops it from creating its own GitHub release against a
      # tag it does not control. It only builds dist/ here; gh publishes below.
      - name: Build with goreleaser
        if: needs.guard.outputs.module == 'mcp' || needs.guard.outputs.module == 'cli'
        working-directory: ${{ needs.guard.outputs.module }}
        env:
          GORELEASER_CURRENT_TAG: v${{ needs.guard.outputs.version }}
        run: |
          mise exec -- goreleaser release --skip=publish,validate --clean

      - name: Publish the module release
        if: needs.guard.outputs.module == 'mcp' || needs.guard.outputs.module == 'cli'
        working-directory: ${{ needs.guard.outputs.module }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        # failglob: an unmatched pattern aborts before the release exists,
        # instead of gh publishing a release missing its checksums or SBOMs.
        run: |
          shopt -s failglob
          gh release create "$TAG_NAME" --title "$TAG_NAME" --verify-tag --notes-file /tmp/release-notes.md \
            dist/*.tar.gz dist/*.zip dist/checksums.txt dist/*.sbom.json

      - name: Create the lib release
        if: needs.guard.outputs.module == 'freshbooks'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" --title "$TAG_NAME" --verify-tag --notes-file /tmp/release-notes.md
