version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - misspell
  settings:
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    generated: strict
    warn-unused: true
    presets: []
    rules:
      # Test files read their own fixtures out of testdata/ by construction
      # (G304) and embed synthetic URLs and token-shaped literals that gosec
      # reads as credentials (G101). Neither is a finding in a _test.go file.
      - path: _test\.go
        linters:
          - gosec
        text: "G(101|304)"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
