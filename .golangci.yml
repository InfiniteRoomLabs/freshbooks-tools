version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - misspell
  settings:
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    generated: strict
    warn-unused: true
    presets: []

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
