version: 2

# NOTE: goreleaser OSS has no monorepo tag-prefix/dir support (that is a
# Pro-only feature); the release workflow instead runs `goreleaser release`
# with `workdir: cli` and GORELEASER_CURRENT_TAG set to the version parsed
# from the "cli/vX.Y.Z" tag. Phase 5 (release hardening) does a real dry
# run against a pushed tag and fixes anything this assumption gets wrong.

builds:
  - id: freshbooks
    main: ./cmd/freshbooks
    binary: freshbooks
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: freshbooks
    ids: [freshbooks]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

changelog:
  disable: true
