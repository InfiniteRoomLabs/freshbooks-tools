version: 2

# NOTE: goreleaser OSS cannot release a prefixed tag ("cli/vX.Y.Z"); the
# release workflow runs `goreleaser release --skip=publish,validate` with
# GORELEASER_CURRENT_TAG set to the bare "vX.Y.Z", then `gh release create`
# publishes the archives onto the real tag. See docs/building.md.

project_name: freshbooks

builds:
  - id: freshbooks
    main: ./cmd/freshbooks
    binary: freshbooks
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: freshbooks
    ids: [freshbooks]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

changelog:
  disable: true
