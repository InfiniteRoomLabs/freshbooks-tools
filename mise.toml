[tools]
go = "1.26.6"
golangci-lint = "2.13.2"
goreleaser = "2.18.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
usage = "6.0.0"
"aqua:anchore/syft" = "1.51.1"
node = "24.14.0"
pnpm = "11.15.1"

[tasks.fmt-check]
description = "Check gofmt formatting for one or more modules (default: all)"
run = "scripts/check.sh fmt-check"

[tasks.vet]
description = "Run go vet for one or more modules (default: all)"
run = "scripts/check.sh vet"

[tasks.lint]
description = "Run golangci-lint for one or more modules (default: all)"
run = "scripts/check.sh lint"

[tasks.test]
description = "Run go test -race with coverage for one or more modules (default: all)"
run = "scripts/check.sh test"

[tasks.cover]
description = "Enforce the 90% coverage floor for one or more modules (default: all)"
run = "scripts/check.sh cover"

[tasks.vuln]
description = "Run govulncheck for one or more modules (default: all)"
run = "scripts/check.sh vuln"

[tasks.actionlint]
description = "Lint .github/workflows/*.yml"
run = "actionlint .github/workflows/*.yml"

[tasks.shellcheck]
description = "Lint scripts/*.sh at -S warning"
run = "scripts/check.sh shellcheck"

[tasks.readme-drift-check]
description = "Check README.md's Status column against the newest git tags (read-only)"
run = "scripts/check.sh readme-drift-check"

[tasks.repo-wide]
description = "The module-independent gate steps: actionlint, shellcheck, redaction-selftest, release-selftest, readme-drift-check, site-build"
run = "scripts/check.sh repo-wide"

[tasks.site-sync]
description = "Regenerate site/docs/ from README.md and the docs/*.md guides for the Docusaurus site"
run = "scripts/site-sync.sh"

[tasks.site]
description = "Run the Docusaurus dev server (site/docs/ synced first)"
run = "scripts/site-sync.sh && mise exec -- pnpm --dir site start"

[tasks.site-build]
description = "Sync docs, install (frozen lockfile), and build the Docusaurus site into site/build/"
run = "scripts/site-build.sh"

[tasks.redaction-selftest]
description = "Run the redaction-check.sh regression test (both modes, no network)"
run = "scripts/redaction-selftest.sh"

[tasks.release-selftest]
description = "Run the release.sh regression test (scratch repos, fake gh/go, no network)"
run = "scripts/release-selftest.sh"

[tasks.inventory-check]
description = "Run the inventory parity check against freshbooks source"
run = "scripts/check.sh inventory-check"

[tasks.build]
description = "Cross-compile the mcp and cli binaries into dist/ (gitignored)"
run = "scripts/build.sh"

[tasks.docs]
description = "Regenerate docs/cli.md from the cobra command tree (cobra/doc)"
run = "scripts/docs.sh"

[tasks.check]
description = "Full gate: fmt-check, vet, lint, test, cover, inventory-check, build, the repo-wide steps (actionlint, shellcheck, redaction-selftest, release-selftest, readme-drift-check, site-build -- skipped when a module filter is given, since CI runs them once via the repo-wide job), then a dirty-tree banner"
run = "scripts/check.sh all"

[tasks.release]
description = "Release automation: preflight, cut, bump, verify, docs, all (see docs/building.md)"
run = "scripts/release.sh"
