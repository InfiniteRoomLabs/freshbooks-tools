[tools]
go = "1.26.6"
golangci-lint = "2.13.2"
goreleaser = "2.18.0"
actionlint = "1.7.12"
usage = "6.0.0"
"aqua:anchore/syft" = "1.51.1"

[tasks.fmt-check]
description = "Check gofmt formatting for one or more modules (default: all)"
run = "scripts/check.sh fmt-check"

[tasks.vet]
description = "Run go vet for one or more modules (default: all)"
run = "scripts/check.sh vet"

[tasks.lint]
description = "Run golangci-lint for one or more modules (default: all)"
run = "scripts/check.sh lint"

[tasks.test]
description = "Run go test -race with coverage for one or more modules (default: all)"
run = "scripts/check.sh test"

[tasks.cover]
description = "Enforce the 90% coverage floor for one or more modules (default: all)"
run = "scripts/check.sh cover"

[tasks.vuln]
description = "Run govulncheck for one or more modules (default: all)"
run = "scripts/check.sh vuln"

[tasks.actionlint]
description = "Lint .github/workflows/*.yml"
run = "actionlint .github/workflows/*.yml"

[tasks.inventory-check]
description = "Run the inventory parity check against freshbooks source"
run = "scripts/check.sh inventory-check"

[tasks.build]
description = "Cross-compile the mcp and cli binaries into dist/ (gitignored)"
run = "scripts/build.sh"

[tasks.docs]
description = "Regenerate docs/cli.md from the cobra command tree (cobra/doc)"
run = "scripts/docs.sh"

[tasks.check]
description = "Full gate: fmt-check, vet, lint, test, cover, inventory-check, build, then a dirty-tree banner"
run = "scripts/check.sh all"
